# 안드로이드 「나의 달력」 앱(홈 화면 위젯) APK 만들기 — android/ 가 바뀌면 자동 실행
# 결과는 서명 전 APK(unsigned.apk). 서명은 열쇠를 가진 쪽에서 android/tools/sign.mjs 로 함.
name: android
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: 빌드
        run: bash android/build.sh
      # 서명하는 쪽(Claude 작업 환경)이 artifact 저장소에 못 닿아서, 로그로도 꺼내 갈 수 있게 함
      - name: APK 내용 (base64)
        run: |
          sha256sum android/build/unsigned.apk
          echo "----BEGIN APK----"; base64 -w 100 android/build/unsigned.apk; echo "----END APK----"
      - uses: actions/upload-artifact@v4
        with:
          name: my-calendar-unsigned
          path: android/build/unsigned.apk

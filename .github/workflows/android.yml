# 안드로이드 「나의 달력」 앱(홈 화면 위젯) APK 만들기 — android/ 가 바뀌면 자동 실행
# 결과는 서명 전 APK(unsigned.apk). 서명은 열쇠를 가진 쪽에서 android/tools/sign.mjs 로 함.
name: android
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: 빌드
        run: bash android/build.sh
      # 서명하는 쪽(Claude 작업 환경)이 artifact·로그 저장소에 못 닿아서, 서명 전 APK 를
      # android-build 브랜치에 올려 git 으로 가져가게 함 (사이트(main)에는 영향 없음)
      - name: android-build 브랜치에 올리기
        run: |
          mkdir -p /tmp/out && cp android/build/unsigned.apk /tmp/out/ && cd /tmp/out
          git init -q -b android-build && git add unsigned.apk
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "unsigned APK from ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" android-build
      - uses: actions/upload-artifact@v4
        with:
          name: my-calendar-unsigned
          path: android/build/unsigned.apk

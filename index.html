<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>우리 가족</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#F7F2EB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1B19" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="우리 가족">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="app">

    <!-- 로그인 -->
    <section id="login" class="screen login" hidden>
      <div class="login-card">
        <img src="icons/icon-192.png" class="login-logo" alt="" width="72" height="72">
        <h1 id="login-title">우리 가족</h1>
        <p class="login-sub">가족만 들어올 수 있는 채팅방이에요</p>
        <form id="login-form" novalidate>
          <label>이메일
            <input type="email" name="email" autocomplete="username" inputmode="email" required>
          </label>
          <label>비밀번호
            <input type="password" name="password" autocomplete="current-password" required>
          </label>
          <p id="login-error" class="error" role="alert" hidden></p>
          <button type="submit" class="primary">들어가기</button>
        </form>
      </div>
    </section>

    <!-- 채팅 -->
    <section id="chat" class="screen chat" hidden>
      <header class="topbar">
        <div class="title">
          <h1 id="chat-title">우리 가족</h1>
          <p id="chat-members"></p>
        </div>
        <button id="btn-bell" class="icon-btn" type="button" aria-label="알림" hidden>
          <svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5"/><path d="M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="m2 2 20 20"/></svg>
        </button>
        <button id="btn-menu" class="icon-btn" type="button" aria-label="메뉴" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
        </button>
        <div id="menu" class="menu" role="menu" hidden>
          <button type="button" role="menuitem" data-act="password">비밀번호 변경</button>
          <button type="button" role="menuitem" data-act="logout">로그아웃</button>
        </div>
      </header>

      <nav class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-chat" data-tab="chat" aria-selected="true">
          채팅<span id="chat-dot" class="tab-dot" hidden></span>
        </button>
        <button type="button" role="tab" id="tab-cal" data-tab="cal" aria-selected="false">달력</button>
      </nav>

      <div id="install-banner" class="banner" hidden>
        <p></p>
        <button type="button" class="banner-action" hidden>설치</button>
        <button type="button" class="banner-close" aria-label="닫기">✕</button>
      </div>

      <!-- 채팅 탭 -->
      <div id="pane-chat" class="pane" role="tabpanel" aria-labelledby="tab-chat">
        <button id="today-strip" class="today-strip" type="button" hidden></button>
        <main id="messages" class="messages" aria-live="polite"></main>
        <button id="new-pill" class="new-pill" type="button" hidden>새 메시지 ↓</button>

        <form id="composer" class="composer">
          <label class="icon-btn attach" aria-label="사진 보내기" title="사진 보내기">
            <input id="file" type="file" accept="image/*" multiple hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
          </label>
          <textarea id="input" rows="1" placeholder="메시지 입력" aria-label="메시지 입력"></textarea>
          <button id="btn-send" class="send" type="submit" aria-label="보내기" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
          </button>
        </form>
      </div>

      <!-- 달력 탭 -->
      <div id="pane-cal" class="pane cal" role="tabpanel" aria-labelledby="tab-cal" hidden>
        <div class="cal-head">
          <button id="cal-prev" class="icon-btn" type="button" aria-label="이전 달">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <h2 id="cal-title"></h2>
          <button id="cal-next" class="icon-btn" type="button" aria-label="다음 달">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
          <button id="cal-today" class="chip-btn" type="button">오늘</button>
        </div>
        <div id="cal-scroll" class="cal-scroll">
          <div class="cal-week" aria-hidden="true">
            <span class="red">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="blue">토</span>
          </div>
          <div id="cal-grid" class="cal-grid"></div>
          <section class="cal-day">
            <h3 id="cal-day-title"></h3>
            <ul id="cal-day-list" class="day-list"></ul>
          </section>
        </div>
        <button id="cal-add" class="fab" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>일정 추가
        </button>
      </div>
    </section>

  </div>

  <!-- 일정 추가/수정 -->
  <dialog id="event-dialog" class="sheet" aria-labelledby="ev-dialog-title" tabindex="-1">
    <form id="event-form" class="sheet-body" novalidate>
      <h2 id="ev-dialog-title">일정 추가</h2>

      <label class="field">제목
        <input id="ev-title" type="text" maxlength="100" placeholder="예: 할머니 댁 방문" autocomplete="off" required>
      </label>

      <div class="field-row">
        <label class="field">시작하는 날
          <input id="ev-start" type="date" required>
        </label>
        <label class="field">끝나는 날
          <input id="ev-end" type="date">
        </label>
      </div>

      <label class="switch">
        <input id="ev-allday" type="checkbox" checked>
        <span>하루 종일</span>
      </label>

      <div id="ev-times" class="field-row" hidden>
        <label class="field">시작 시간
          <input id="ev-stime" type="time" step="300">
        </label>
        <label class="field">끝 시간 (선택)
          <input id="ev-etime" type="time" step="300">
        </label>
      </div>

      <div class="field">
        <span>누구 일정인가요? <small>(안 고르면 가족 모두)</small></span>
        <div id="ev-who" class="chips"></div>
      </div>

      <label class="field">반복
        <select id="ev-repeat">
          <option value="none">반복 안 함</option>
          <option value="weekly">매주</option>
          <option value="monthly">매월</option>
          <option value="yearly">매년 (생일·기념일)</option>
        </select>
      </label>

      <label class="field">메모
        <textarea id="ev-memo" rows="2" maxlength="1000" placeholder="장소, 준비물 등"></textarea>
      </label>

      <label class="switch">
        <input id="ev-announce" type="checkbox" checked>
        <span id="ev-announce-text">채팅방에 알리기</span>
      </label>

      <div class="sheet-actions">
        <button id="ev-delete" type="button" class="danger" hidden>삭제</button>
        <span class="spacer"></span>
        <button id="ev-cancel" type="button" class="ghost">취소</button>
        <button id="ev-save" type="submit" class="primary">저장</button>
      </div>
    </form>
  </dialog>

  <div id="lightbox" class="lightbox" hidden><img alt="사진 크게 보기"></div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
